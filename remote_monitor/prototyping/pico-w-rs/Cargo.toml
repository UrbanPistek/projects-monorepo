[package]
name = "pico-w-rs"
version = "0.1.0"
edition = "2024"

# tell Cargo not to build a test harness for the firmware binary
[[bin]]
name = "blinky"
path = "src/main.rs"
test = false
bench = false

# tell Cargo not to build a test harness for the firmware binary
[[bin]]
name = "serial-echo"
path = "src/bin/serial.rs"
test = false
bench = false

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
embedded-hal = { version = "1.0.0" }
panic-halt = "1.0.0"

defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }

# We're using a Pico by default on this template
rp-pico = "0.9"

# If you're not going to use a Board Support Package you'll need these:
# rp2040-hal = { version="0.11", features=["rt", "critical-section-impl"] }
# rp2040-boot2 = "0.3"


# Serial Dependencies
heapless = "0.7.16"
usb-device = "0.3.1"
usbd-serial = "0.2.1"

# cargo build/run
[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true

# cargo build/run --release
[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3
overflow-checks = false