[build]
# RP2040 is an ARM Cortex-M0+ (Thumb instruction set, no FPU, no atomics)
target = "thumbv6m-none-eabi"

[target.thumbv6m-none-eabi]
# Pass the memory layout and flip-link (stack-overflow detection) to the linker
rustflags = [
    "-C", "linker=flip-link",
    "-C", "link-arg=-Tlink.x",
    "-C", "link-arg=-Tdefmt.x",
]

# probe-rs is the recommended runner — it flashes the ELF and streams defmt logs
# Install: cargo install --locked probe-rs-tools
runner = "probe-rs run --chip RP2040"

[env]
# Set the defmt log level.  Change to "trace" when debugging BLE init issues.
DEFMT_LOG = "info"
