[package]
name = "pico-w-iot-beacon"
version = "0.1.0"
edition = "2024"
test = false

# tell Cargo not to build a test harness for the firmware binary
[[bin]]
name = "app"
path = "src/main.rs"
test = false
bench = false

[dependencies]
embassy-executor = { version = "0.10.0", git = "https://github.com/embassy-rs/embassy.git", rev = "56b52e66b59069eeb0ceeed2c7c096ee703413fe", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { version = "0.5.1", git = "https://github.com/embassy-rs/embassy.git", rev = "56b52e66b59069eeb0ceeed2c7c096ee703413fe", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-futures = { version = "0.1.1", git = "https://github.com/embassy-rs/embassy.git", rev = "56b52e66b59069eeb0ceeed2c7c096ee703413fe" }
embassy-rp = { version = "0.10.0", git = "https://github.com/embassy-rs/embassy.git", rev = "56b52e66b59069eeb0ceeed2c7c096ee703413fe", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp2040"] }
cyw43 = { version = "0.7.0", git = "https://github.com/embassy-rs/embassy.git", rev = "56b52e66b59069eeb0ceeed2c7c096ee703413fe", features = ["defmt", "firmware-logs", "bluetooth"] }
cyw43-pio = { version = "0.10.0", git = "https://github.com/embassy-rs/embassy.git", rev = "56b52e66b59069eeb0ceeed2c7c096ee703413fe", features = ["defmt"] }
trouble-host = { version = "0.7.0", git = "https://github.com/embassy-rs/trouble.git" }
bt-hci = { version = "0.9", default-features = false, features = ["uuid"] }

defmt = "1.0.1"
defmt-rtt = "1.0.0"
fixed = "1.23.1"
fixed-macro = "1.2"

cortex-m = { version = "0.7.6", features = ["inline-asm"] }
cortex-m-rt = "0.7.0"
critical-section = "1.1"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
heapless = "0.9"

embedded-hal-1 = { package = "embedded-hal", version = "1.0" }
static_cell = "2.1"
portable-atomic = { version = "1.5", features = ["critical-section"] }

# cargo build/run
[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true

# cargo build/run --release
[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3
overflow-checks = false

[package.metadata.embassy]
build = [
  { target = "thumbv6m-none-eabi", artifact-dir = "out/examples/rp" }
]

[patch.crates-io]
embassy-time = { git = "https://github.com/embassy-rs/embassy.git", rev = "56b52e66b59069eeb0ceeed2c7c096ee703413fe" }
embassy-time-driver = { git = "https://github.com/embassy-rs/embassy.git", rev = "56b52e66b59069eeb0ceeed2c7c096ee703413fe" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy.git", rev = "56b52e66b59069eeb0ceeed2c7c096ee703413fe" }
embassy-futures = { git = "https://github.com/embassy-rs/embassy.git", rev = "56b52e66b59069eeb0ceeed2c7c096ee703413fe" }